<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grafynex - Ordenes</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
:root {
  --bg:#060d18; --card:#0d1b2a; --card2:#0f2035;
  --border:#1a3050; --accent:#f97316; --blue:#22d3ee;
  --green:#22c55e; --red:#ef4444; --yellow:#eab308;
  --text:#f8fafc; --muted:#64748b; --sub:#94a3b8;
}
body { background:var(--bg); color:var(--text); font-family:'Segoe UI',sans-serif; min-height:100vh; }
nav { background:var(--card); border-bottom:1px solid var(--border); padding:0 14px; position:sticky; top:0; z-index:100; display:flex; align-items:center; justify-content:space-between; height:52px; }
.nav-tabs { display:flex; gap:3px; }
.nav-tab { padding:5px 9px; border-radius:8px; border:none; cursor:pointer; font-weight:600; font-size:11px; background:transparent; color:var(--muted); }
.nav-tab.active { background:var(--accent); color:#fff; }
main { max-width:520px; margin:0 auto; padding:14px 14px 60px; }
.card { background:var(--card); border-radius:14px; padding:16px; margin-bottom:12px; border:1px solid var(--border); }
.card-title { color:var(--accent); font-weight:700; font-size:11px; text-transform:uppercase; letter-spacing:1px; margin-bottom:12px; }
label { display:block; color:var(--sub); font-size:12px; font-weight:600; margin-bottom:4px; }
input, select, textarea { width:100%; padding:10px 12px; border-radius:8px; border:1px solid var(--border); background:#060d18; color:var(--text); font-size:14px; outline:none; font-family:inherit; }
textarea { height:80px; resize:vertical; }
.grid2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.grid3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; }
.btn { width:100%; padding:13px; border-radius:12px; border:none; color:#fff; font-weight:800; font-size:15px; cursor:pointer; margin-bottom:10px; }
.btn-orange { background:linear-gradient(135deg,#f97316,#ea580c); }
.btn-green { background:linear-gradient(135deg,#22c55e,#15803d); }
.btn-red { background:linear-gradient(135deg,#ef4444,#b91c1c); }
.btn-blue { background:linear-gradient(135deg,#1d4ed8,#1e40af); }
.btn-sm { padding:6px 12px; border-radius:8px; border:none; font-weight:700; font-size:12px; cursor:pointer; color:#fff; }
.page { display:none; }
.page.active { display:block; }
.upload-zone { border:2px dashed var(--border); border-radius:12px; padding:24px; text-align:center; cursor:pointer; margin-bottom:10px; }
.upload-zone:hover { border-color:var(--accent); }
.upload-zone input { display:none; }
.empty { text-align:center; padding:40px 20px; color:var(--muted); }
.badge { font-size:10px; font-weight:700; padding:3px 8px; border-radius:20px; display:inline-block; }
.badge-P { background:#1a3050; color:var(--blue); }
.badge-E { background:#1a2f1a; color:var(--green); }
.badge-En { background:#052010; color:var(--green); border:1px solid var(--green); }
.badge-C { background:#1a2f0a; color:var(--yellow); }
.oc-card { background:var(--card2); border-radius:12px; padding:14px; margin-bottom:10px; border:1px solid var(--border); }
.prog-bar { background:var(--border); border-radius:20px; height:7px; overflow:hidden; margin-bottom:4px; }
.modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,.75); z-index:500; padding:16px; overflow-y:auto; }
.modal.open { display:flex; align-items:flex-start; justify-content:center; }
.modal-content { background:var(--card); border-radius:16px; padding:18px; width:100%; max-width:480px; margin-top:10px; border:1px solid var(--border); }
.modal-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; }
.modal-title { font-weight:800; font-size:15px; color:var(--accent); flex:1; padding-right:8px; }
.btn-close { padding:4px 10px; border-radius:8px; border:1px solid var(--border); background:transparent; color:var(--muted); font-size:14px; cursor:pointer; }
.cat-grid { display:grid; grid-template-columns:1fr 1fr; gap:6px; margin-bottom:10px; }
.cat-btn { padding:8px; border-radius:8px; border:2px solid var(--border); background:transparent; color:var(--muted); font-weight:700; font-size:12px; cursor:pointer; }
.cat-btn.active { border-color:var(--accent); background:#1a2f1a; color:var(--accent); }
.pago-grid { display:flex; gap:6px; margin-bottom:10px; flex-wrap:wrap; }
.pago-btn { flex:1; min-width:70px; padding:8px; border-radius:8px; border:2px solid var(--border); background:transparent; color:var(--muted); font-weight:700; font-size:12px; cursor:pointer; text-align:center; }
.pago-btn.active { border-color:var(--accent); background:#1a2f1a; color:var(--accent); }
.gasto-item { background:#060d18; border-radius:10px; padding:10px 12px; margin-bottom:6px; border:1px solid var(--border); display:flex; justify-content:space-between; align-items:flex-start; }
.pago-badge { font-size:10px; font-weight:700; padding:2px 6px; border-radius:20px; }
.PY { background:#7c3aed; color:#fff; }
.PP { background:#22c55e; color:#fff; }
.PE { background:#f97316; color:#fff; }
.PT { background:#22d3ee; color:#000; }
.PD { background:#1d4ed8; color:#fff; }
.etapas-grid { display:grid; grid-template-columns:1fr 1fr; gap:5px; margin-top:8px; }
.etapa-btn { padding:9px 6px; border-radius:8px; border:2px solid var(--border); background:transparent; color:var(--muted); font-weight:700; font-size:12px; cursor:pointer; text-align:center; transition:all .15s; }
.etapa-btn.done { border-color:var(--green); background:#052010; color:var(--green); }
.etapa-btn.current { border-color:var(--accent); background:#1a2f1a; color:var(--accent); }
.item-card { background:#060d18; border-radius:10px; padding:12px; margin-bottom:8px; border:1px solid var(--border); }
.item-card.all-done { border-color:var(--green); background:#030f06; }
.item-card { background:#060d18; border-radius:10px; padding:12px; margin-bottom:8px; border:1px solid var(--border); }
.toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--accent); color:#fff; padding:10px 18px; border-radius:20px; font-size:13px; font-weight:700; z-index:9999; display:none; max-width:90%; text-align:center; }
</style>
</head>
<body>
<nav>
  <div style="font-weight:900;font-size:18px"><span style="color:var(--accent)">GRAFY</span><span style="color:var(--text)">NEX</span> <span style="color:var(--muted);font-size:10px;font-weight:400">Ordenes</span></div>
  <div class="nav-tabs">
    <button class="nav-tab active" onclick="showPage('ordenes',this)">OCs</button>
    <button class="nav-tab" onclick="showPage('nueva',this)">+ Nueva</button>
    <button class="nav-tab" onclick="showPage('produccion',this)">Prod.</button>
    <button class="nav-tab" onclick="showPage('resumen',this)">Resumen</button>
  </div>
</nav>
<main>
  <div id="page-ordenes" class="page active">
    <div style="display:flex;gap:8px;margin-bottom:12px">
      <input type="text" id="buscar-oc" placeholder="Buscar OC o cliente..." oninput="renderOCs()">
      <select id="filtro-estado" onchange="renderOCs()" style="width:auto;padding:10px 8px">
        <option value="">Todos</option>
        <option value="Pendiente">Pendiente</option>
        <option value="En produccion">Produccion</option>
        <option value="Entregado">Entregado</option>
        <option value="Cobrado">Cobrado</option>
      </select>
    </div>
    <div id="ocs-lista"></div>
  </div>

  <div id="page-nueva" class="page">
    <div class="card">
      <div class="card-title">PDF de la Orden (opcional)</div>
      <div class="upload-zone" onclick="document.getElementById('pdfInput').click()">
        <input type="file" id="pdfInput" accept=".pdf" onchange="procesarPDF(event)">
        <div style="font-size:32px;margin-bottom:6px">&#128196;</div>
        <div style="color:var(--sub);font-size:13px">Tocar para subir el PDF<br><strong style="color:var(--accent)">Los datos se extraen automaticamente</strong></div>
      </div>
      <div id="pdf-preview" style="display:none;background:#1a3050;border-radius:8px;padding:10px;font-size:12px;color:var(--sub)"></div>
    </div>
    <div class="card">
      <div class="card-title">Datos de la orden</div>
      <div class="grid2" style="margin-bottom:10px">
        <div><label>No. Orden</label><input type="text" id="ocNum" placeholder="P26091" style="color:var(--accent);font-weight:700"></div>
        <div><label>Fecha limite</label><input type="date" id="ocFecha"></div>
      </div>
      <div style="margin-bottom:10px"><label>Cliente</label><input type="text" id="ocCliente" placeholder="Agrovet Market S.A"></div>
      <div style="margin-bottom:10px"><label>Productos / Items</label><textarea id="ocProducto" placeholder="Los items aparecen aqui al subir el PDF..." style="height:100px"></textarea></div>
      <div class="grid2" style="margin-bottom:10px">
        <div><label>Cantidad total</label><input type="number" id="ocCantidad" placeholder="22500" oninput="calcularTotales()"></div>
        <div><label>Precio unitario S/.</label><input type="number" id="ocPrecioUnit" placeholder="0.0318" step="0.0001" oninput="calcularTotales()"></div>
      </div>
      <div class="grid3" style="margin-bottom:10px">
        <div><label>Base imponible</label><input type="number" id="ocBase" placeholder="715.50" oninput="calcIGV()"></div>
        <div><label>IGV 18%</label><input type="number" id="ocIGV" placeholder="128.79" readonly style="color:var(--muted)"></div>
        <div><label>Total S/.</label><input type="number" id="ocTotal" placeholder="844.29" readonly style="color:var(--accent);font-weight:700"></div>
      </div>
      <div style="margin-bottom:10px">
        <label>Condiciones de pago</label>
        <select id="ocCondPago">
          <option>CREDITO 30 DIAS</option>
          <option>CREDITO 60 DIAS</option>
          <option>CREDITO 90 DIAS</option>
          <option>CONTADO</option>
          <option>50% ADELANTO</option>
        </select>
      </div>
      <div><label>Observaciones</label><textarea id="ocObs" placeholder="Notas adicionales..."></textarea></div>
    </div>
    <button class="btn btn-orange" onclick="guardarOC()">Guardar Orden de Compra</button>
  </div>

  <div id="page-produccion" class="page">
    <div style="margin-bottom:12px">
      <label>Selecciona la OC</label>
      <select id="prod-oc-select" onchange="renderProduccion()" style="margin-top:4px">
        <option value="">-- Selecciona una OC --</option>
      </select>
    </div>
    <div id="produccion-content"></div>
  </div>

  <div id="page-resumen" class="page">
    <div class="card">
      <div class="card-title">Resumen general</div>
      <div id="resumen-content"></div>
    </div>
  </div>
</main>

<div class="modal" id="modal-oc">
  <div class="modal-content">
    <div class="modal-header">
      <span class="modal-title" id="modal-titulo">OC</span>
      <button class="btn-close" onclick="cerrarModal()">X</button>
    </div>
    <div id="modal-body"></div>
  </div>
</div>

<div class="modal" id="modal-gasto">
  <div class="modal-content">
    <div class="modal-header">
      <span class="modal-title">Agregar gasto</span>
      <button class="btn-close" onclick="document.getElementById('modal-gasto').classList.remove('open')">X</button>
    </div>
    <div class="cat-grid" id="gasto-cats">
      <button class="cat-btn active" onclick="setGastoCat('Proveedor',this)">Proveedor</button>
      <button class="cat-btn" onclick="setGastoCat('Papel',this)">Papel</button>
      <button class="cat-btn" onclick="setGastoCat('Placas',this)">Placas</button>
      <button class="cat-btn" onclick="setGastoCat('Impresion',this)">Impresion</button>
      <button class="cat-btn" onclick="setGastoCat('Dobles/Corte',this)">Dobles/Corte</button>
      <button class="cat-btn" onclick="setGastoCat('Acabados',this)">Acabados</button>
      <button class="cat-btn" onclick="setGastoCat('Servicios',this)">Servicios</button>
      <button class="cat-btn" onclick="setGastoCat('Transporte',this)">Transporte</button>
      <button class="cat-btn" onclick="setGastoCat('Otro',this)">Otro</button>
    </div>
    <div style="margin-bottom:8px"><label>Descripcion</label><input type="text" id="g-desc" placeholder="Ej: Papel bond 56g"></div>
    <div class="grid2" style="margin-bottom:8px">
      <div><label>Monto S/.</label><input type="number" id="g-monto" placeholder="0.00" step="0.10"></div>
      <div><label>Fecha</label><input type="date" id="g-fecha"></div>
    </div>
    <div style="margin-bottom:8px"><label>Proveedor / A quien</label><input type="text" id="g-proveedor" placeholder="Ej: Papeleria Sur"></div>
    <div class="pago-grid" id="gasto-pagos">
      <button class="pago-btn active" onclick="setGastoPago('Yape',this)">Yape</button>
      <button class="pago-btn" onclick="setGastoPago('Plin',this)">Plin</button>
      <button class="pago-btn" onclick="setGastoPago('Efectivo',this)">Efectivo</button>
      <button class="pago-btn" onclick="setGastoPago('Transferencia',this)">Transfer.</button>
    </div>
    <button class="btn btn-orange" onclick="guardarGasto()">Guardar gasto</button>
  </div>
</div>

<div class="modal" id="modal-prod">
  <div class="modal-content">
    <div class="modal-header">
      <span class="modal-title">Avance de produccion</span>
      <button class="btn-close" onclick="document.getElementById('modal-prod').classList.remove('open')">X</button>
    </div>
    <div style="margin-bottom:8px"><label>Unidades producidas hasta hoy</label><input type="number" id="p-producidas" placeholder="0"></div>
    <div style="margin-bottom:8px"><label>Fecha</label><input type="date" id="p-fecha"></div>
    <div style="margin-bottom:12px"><label>Notas</label><input type="text" id="p-notas" placeholder="Primera corrida lista"></div>
    <button class="btn btn-green" onclick="guardarProduccion()">Actualizar produccion</button>
  </div>
</div>

<div class="modal" id="modal-cobro">
  <div class="modal-content">
    <div class="modal-header">
      <span class="modal-title">Registrar cobro</span>
      <button class="btn-close" onclick="document.getElementById('modal-cobro').classList.remove('open')">X</button>
    </div>
    <div style="margin-bottom:8px"><label>Monto cobrado S/.</label><input type="number" id="c-monto" placeholder="0.00" step="0.10"></div>
    <div style="margin-bottom:8px"><label>Fecha de cobro</label><input type="date" id="c-fecha"></div>
    <div class="pago-grid" id="cobro-pagos">
      <button class="pago-btn active" onclick="setCobroPago('Transferencia',this)">Transfer.</button>
      <button class="pago-btn" onclick="setCobroPago('Yape',this)">Yape</button>
      <button class="pago-btn" onclick="setCobroPago('Deposito',this)">Deposito</button>
      <button class="pago-btn" onclick="setCobroPago('Efectivo',this)">Efectivo</button>
    </div>
    <div style="margin-bottom:12px"><label>Notas</label><input type="text" id="c-notas" placeholder="Pago parcial"></div>
    <button class="btn btn-green" onclick="guardarCobro()">Registrar cobro</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

// Firebase config
var firebaseConfig = {
  apiKey: "AIzaSyAP1p3jMAgZxQD10EVDJ5Wjs5d-VnoDyGw",
  authDomain: "grafynex-ordenes.firebaseapp.com",
  projectId: "grafynex-ordenes",
  storageBucket: "grafynex-ordenes.firebasestorage.app",
  messagingSenderId: "998388289782",
  appId: "1:998388289782:web:3d8796f33762fcfe005cd7"
};
// Firebase se inicializa cuando la pagina carga completamente
var db = null;

var ocs = [];
var ocActiva = null;
var gastoCat = 'Proveedor';
var gastoPago = 'Yape';
var cobroPago = 'Transferencia';
var dbLoaded = false;

// Escuchar cambios en tiempo real
// onSnapshot moved to window.onload

var ETAPAS = [
  {id:'papel',     label:'Papel',       pct:14.3},
  {id:'placa',     label:'Placa',       pct:14.3},
  {id:'impresion', label:'Impresion',   pct:14.3},
  {id:'corte',     label:'Corte',       pct:14.3},
  {id:'dobles',    label:'Dobles',      pct:14.3},
  {id:'acabado',   label:'Acabado',     pct:14.3},
  {id:'empaque',   label:'Empaquetado', pct:9.7},
  {id:'entregado', label:'Entregado',   pct:4.5}
];

function saveOCs() { /* Firebase auto-sync - no localStorage needed */ }

function saveOC(oc) {
  var docId = String(oc.id);
  db.collection('ocs').doc(docId).set(oc).catch(function(err) {
    console.error('Error saving:', err);
    toast('Error al guardar. Verificá internet.');
  });
}

function deleteOCFromDB(id) {
  db.collection('ocs').doc(String(id)).delete().catch(function(err) {
    console.error('Error deleting:', err);
  });
}
function today() { return new Date().toISOString().split('T')[0]; }
function toast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg; t.style.display = 'block';
  setTimeout(function() { t.style.display = 'none'; }, 2800);
}
function calcPctItem(etapas) {
  if (!etapas) return 0;
  var total = 0;
  ETAPAS.forEach(function(e) { if (etapas[e.id]) total += e.pct; });
  return Math.min(100, Math.round(total * 10) / 10);
}
function calcPctOC(oc) {
  if (!oc.items || oc.items.length === 0) return 0;
  var sum = 0;
  oc.items.forEach(function(it) { sum += calcPctItem(it.etapas); });
  return Math.round(sum / oc.items.length * 10) / 10;
}

document.getElementById('ocFecha').value = today();
document.getElementById('g-fecha').value = today();
document.getElementById('p-fecha').value = today();
document.getElementById('c-fecha').value = today();

function showPage(name, btn) {
  document.querySelectorAll('.page').forEach(function(p) { p.classList.remove('active'); });
  document.querySelectorAll('.nav-tab').forEach(function(t) { t.classList.remove('active'); });
  document.getElementById('page-' + name).classList.add('active');
  btn.classList.add('active');
  if (name === 'ordenes') renderOCs();
  if (name === 'resumen') renderResumen();
  if (name === 'produccion') { poblarSelectOC(); renderProduccion(); }
}

function calcularTotales() {
  var c = parseFloat(document.getElementById('ocCantidad').value) || 0;
  var p = parseFloat(document.getElementById('ocPrecioUnit').value) || 0;
  if (c && p) { document.getElementById('ocBase').value = (c*p).toFixed(2); calcIGV(); }
}
function calcIGV() {
  var b = parseFloat(document.getElementById('ocBase').value) || 0;
  document.getElementById('ocIGV').value = (b*0.18).toFixed(2);
  document.getElementById('ocTotal').value = (b*1.18).toFixed(2);
}

async function procesarPDF(e) {
  var file = e.target.files[0]; if (!file) return;
  ['ocNum','ocCliente','ocProducto','ocCantidad','ocPrecioUnit','ocBase','ocIGV','ocTotal','ocObs'].forEach(function(id) { document.getElementById(id).value = ''; });
  window._pdfItems = null;
  toast('Leyendo PDF...');
  document.getElementById('pdf-preview').style.display = 'block';
  document.getElementById('pdf-preview').innerHTML = 'Procesando: ' + file.name;
  var reader = new FileReader();
  reader.onload = async function(ev) {
    try {
      var pdf = await pdfjsLib.getDocument({ data: ev.target.result }).promise;
      var texto = '';
      for (var i = 1; i <= pdf.numPages; i++) {
        var page = await pdf.getPage(i);
        var ct = await page.getTextContent();
        texto += ct.items.map(function(x) { return x.str; }).join(' ') + '\n';
      }
      var ocNum = '';
      var m1 = texto.match(/presupuesto\s*#\s*(P\d+)/i); if (m1) ocNum = m1[1];
      if (!ocNum) { var m2 = texto.match(/#(P\d+)/); if (m2) ocNum = m2[1]; }
      if (!ocNum) { var m3 = texto.match(/\bP(\d{5,6})\b/); if (m3) ocNum = 'P' + m3[1]; }
      if (ocNum) document.getElementById('ocNum').value = ocNum;
      var mf = texto.match(/(\d{2})\/(\d{2})\/(\d{4})\s+\d{2}:\d{2}/);
      if (mf) document.getElementById('ocFecha').value = mf[3] + '-' + mf[2] + '-' + mf[1];
      var mc = texto.match(/AGROVET MARKET S\.?A\.?/i);
      if (!mc) mc = texto.match(/FARMEX S\.?A\.?/i);
      if (mc) document.getElementById('ocCliente').value = mc[0].trim();
      var mcp = texto.match(/CREDITO \d+ DIAS|CONTADO/i);
      if (mcp) {
        var sel = document.getElementById('ocCondPago');
        for (var j = 0; j < sel.options.length; j++) {
          if (sel.options[j].value.toUpperCase() === mcp[0].toUpperCase()) { sel.value = sel.options[j].value; break; }
        }
      }
      var codigos=[], productos=[], cantidades=[], precios=[], importes=[];
      var itemReg = /\[([A-Z0-9]+)\]\s*([^\[\]]+?)\s+IGV\s+\d{2}\/\d{2}\/\d{4}\s+\d{2}:\d{2}:\d{2}\s+([\d,\.]+)\.000000\s+Unidades\s+([\d\.]+)\s+S\/\s*([\d,\.]+)/g;
      var match;
      while ((match = itemReg.exec(texto)) !== null) {
        codigos.push(match[1].trim());
        productos.push(match[2].trim().replace(/\s+/g, ' '));
        cantidades.push(parseFloat(match[3].replace(/,/g, '')));
        precios.push(parseFloat(match[4]));
        importes.push(parseFloat(match[5].replace(/,/g, '')));
      }
      window._pdfItems = [];
      for (var ki = 0; ki < productos.length; ki++) {
        window._pdfItems.push({ codigo: codigos[ki]||'', desc: productos[ki]||'', cant: cantidades[ki]||0, precio: precios[ki]||0, importe: importes[ki]||0, etapas: {} });
      }
      if (productos.length > 0) {
        document.getElementById('ocProducto').value = productos.map(function(p, i) {
          return (i+1) + '. ' + p + ' (' + (cantidades[i]||0).toLocaleString() + ' uds)';
        }).join('\n');
        document.getElementById('ocCantidad').value = cantidades.reduce(function(a,b){return a+b;},0);
        if (precios.length > 0) document.getElementById('ocPrecioUnit').value = precios[0];
      }
      var baseReg = /Base imponible\s*S\/\s*([\d,]+\.?\d*)/g;
      var bm = [];
      while ((match = baseReg.exec(texto)) !== null) bm.push(parseFloat(match[1].replace(/,/g,'')));
      if (bm.length > 0) { document.getElementById('ocBase').value = bm[bm.length-1].toFixed(2); calcIGV(); }
      else calcularTotales();
      document.getElementById('pdf-preview').innerHTML = '<span style="color:#22c55e;font-weight:700">Listo: ' + productos.length + ' items cargados</span>';
      toast('PDF leido: ' + productos.length + ' items');
    } catch(err) {
      document.getElementById('pdf-preview').innerHTML = '<span style="color:#ef4444">Error al leer PDF. Ingresa datos manualmente.</span>';
      toast('Error al leer PDF');
    }
  };
  reader.readAsArrayBuffer(file);
}

function guardarOC() {
  var num = document.getElementById('ocNum').value.trim();
  var cliente = document.getElementById('ocCliente').value.trim();
  if (!num) { toast('Ingresa el numero de orden'); return; }
  if (!cliente) { toast('Ingresa el cliente'); return; }
  var oc = {
    id: Date.now(), num: num, cliente: cliente,
    producto: document.getElementById('ocProducto').value.trim(),
    cantidad: parseFloat(document.getElementById('ocCantidad').value) || 0,
    precioUnit: parseFloat(document.getElementById('ocPrecioUnit').value) || 0,
    base: parseFloat(document.getElementById('ocBase').value) || 0,
    igv: parseFloat(document.getElementById('ocIGV').value) || 0,
    total: parseFloat(document.getElementById('ocTotal').value) || 0,
    condPago: document.getElementById('ocCondPago').value,
    obs: document.getElementById('ocObs').value.trim(),
    fechaLimite: document.getElementById('ocFecha').value,
    fechaCreacion: today(), estado: 'Pendiente', producidas: 0,
    items: window._pdfItems || [], avanceProd: [], gastos: [], cobros: []
  };
  window._pdfItems = null;
  var idx = ocs.findIndex(function(o) { return o.num === num; });
  if (idx >= 0) {
    if (!confirm('Ya existe la OC ' + num + '. Actualizar?')) return;
    oc.gastos = ocs[idx].gastos || [];
    oc.cobros = ocs[idx].cobros || [];
    oc.avanceProd = ocs[idx].avanceProd || [];
    oc.producidas = ocs[idx].producidas || 0;
    oc.estado = ocs[idx].estado;
    if (oc.items.length === 0) oc.items = ocs[idx].items || [];
    else oc.items = oc.items.map(function(it,i) { var o2=(ocs[idx].items||[])[i]; it.etapas=(o2&&o2.etapas)?o2.etapas:{}; return it; });
    ocs[idx] = oc;
  } else { ocs.unshift(oc); }
  saveOC(oc);
  ['ocNum','ocCliente','ocProducto','ocCantidad','ocPrecioUnit','ocBase','ocIGV','ocTotal','ocObs'].forEach(function(id) { document.getElementById(id).value = ''; });
  document.getElementById('pdf-preview').style.display = 'none';
  document.getElementById('pdfInput').value = '';
  toast('OC ' + num + ' guardada');
  showPage('ordenes', document.querySelectorAll('.nav-tab')[0]);
}

function renderOCs() {

    return (!buscar || o.num.toLowerCase().includes(buscar) || (o.cliente||'').toLowerCase().includes(buscar)) &&

    html += '<button onclick="confirmarEliminar(' + oc.id + ')" style="padding:3px 8px;border-radius:6px;border:1px solid #450a0a;background:transparent;color:#ef4444;font-size:11px;cursor:pointer">X</button></div></div>';
    html += '<div style="color:var(--sub);font-size:12px;margin-bottom:6px">' + oc.cliente + ' | ' + (oc.fechaLimite||'') + '</div>';
    html += '<div style="display:flex;gap:6px;margin-bottom:8px"><span class="badge ' + (badgeClass[oc.estado]||'badge-P') + '">' + oc.estado + '</span>';
    if (oc.condPago) html += '<span class="badge badge-P">' + oc.condPago + '</span>';
    html += '</div>';
    html += '<div style="display:flex;justify-content:space-between;font-size:11px;color:var(--sub);margin-bottom:3px"><span>Produccion</span><span>' + pP + '% (' + (oc.items||[]).length + ' items)</span></div>';
    html += '<div class="prog-bar"><div style="height:100%;border-radius:20px;background:linear-gradient(90deg,#f97316,#eab308);width:' + pP + '%"></div></div>';
    html += '<div style="display:flex;justify-content:space-between;font-size:11px;color:var(--sub);margin-bottom:3px;margin-top:6px"><span>Cobro</span><span>S/. ' + tC.toFixed(2) + ' / ' + oc.total.toFixed(2) + '</span></div>';
    html += '<div class="prog-bar"><div style="height:100%;border-radius:20px;background:linear-gradient(90deg,#22c55e,#15803d);width:' + pC + '%"></div></div>';

function verOC(id) {
  ocActiva = null;
  var sid = String(id);
  for (var i = 0; i < ocs.length; i++) { if (String(ocs[i].id) === sid) { ocActiva = ocs[i]; break; } }
  if (!ocActiva) return;
  renderModalOC();
  document.getElementById('modal-oc').classList.add('open');
}
function cerrarModal() { document.getElementById('modal-oc').classList.remove('open'); }
function confirmarEliminar(id) {
  var sid = String(id);
  var oc = ocs.find(function(o) { return String(o.id) === sid; });
  if (!oc || !confirm('Eliminar OC ' + oc.num + '?')) return;
  deleteOCFromDB(id);
  toast('OC eliminada');
}

function cambiarEstado(e) { if (!ocActiva) return; ocActiva.estado = e;  toast('Estado: ' + e); }

function abrirModalProd() {
  document.getElementById('p-producidas').value = ocActiva ? ocActiva.producidas : 0;
  document.getElementById('p-fecha').value = today();
  document.getElementById('p-notas').value = '';
  document.getElementById('modal-prod').classList.add('open');
}
function guardarProduccion() {
  var cant = parseFloat(document.getElementById('p-producidas').value) || 0;
  if (!ocActiva) return;
  var ant = ocActiva.producidas || 0;
  ocActiva.producidas = cant;
  if (!ocActiva.avanceProd) ocActiva.avanceProd = [];
  ocActiva.avanceProd.unshift({ fecha: document.getElementById('p-fecha').value, cantidad: cant-ant, notas: document.getElementById('p-notas').value, id: Date.now() });
  if (cant >= ocActiva.cantidad) ocActiva.estado = 'Entregado';
  else if (cant > 0) ocActiva.estado = 'En produccion';
  saveOC(ocActiva); document.getElementById('modal-prod').classList.remove('open');
  renderModalOC(); toast('Produccion actualizada');
}

function setGastoCat(cat, btn) { gastoCat = cat; document.querySelectorAll('#gasto-cats .cat-btn').forEach(function(b) { b.classList.remove('active'); }); btn.classList.add('active'); }
function setGastoPago(p, btn) { gastoPago = p; document.querySelectorAll('#gasto-pagos .pago-btn').forEach(function(b) { b.classList.remove('active'); }); btn.classList.add('active'); }
function abrirModalGasto() { document.getElementById('g-desc').value=''; document.getElementById('g-monto').value=''; document.getElementById('g-proveedor').value=''; document.getElementById('g-fecha').value=today(); document.getElementById('modal-gasto').classList.add('open'); }
function guardarGasto() {
  var desc = document.getElementById('g-desc').value.trim();
  var monto = parseFloat(document.getElementById('g-monto').value);
  if (!desc || !monto || monto <= 0) { toast('Completa descripcion y monto'); return; }
  if (!ocActiva) return;
  if (!ocActiva.gastos) ocActiva.gastos = [];
  ocActiva.gastos.unshift({ id: Date.now(), cat: gastoCat, desc: desc, monto: monto, fecha: document.getElementById('g-fecha').value, proveedor: document.getElementById('g-proveedor').value.trim(), pago: gastoPago });
  saveOC(ocActiva); document.getElementById('modal-gasto').classList.remove('open'); renderModalOC();
  toast('Gasto S/. ' + monto.toFixed(2) + ' agregado');
}
function eliminarGasto(id) {
  if (!confirm('Eliminar este gasto?')) return;
  ocActiva.gastos = (ocActiva.gastos||[]).filter(function(g) { return g.id !== id; });
  saveOC(ocActiva); renderModalOC(); toast('Gasto eliminado');

function handleEtapaClick(btn) {
  var ocId = btn.getAttribute('data-ocid');
  var itemIdx = parseInt(btn.getAttribute('data-itemidx'));
  var etapaId = btn.getAttribute('data-etapa');
  toggleEtapa(ocId, itemIdx, etapaId);
}

function handleWAItem(btn) {
  var ocId = btn.getAttribute('data-ocid');
  var itemIdx = parseInt(btn.getAttribute('data-itemidx'));
  compartirItemWA(ocId, itemIdx);
}

function toggleEtapa(ocId, itemIdx, etapaId) {
  var oc = null;
  var sid = String(ocId);
  for (var i = 0; i < ocs.length; i++) { if (String(ocs[i].id) === sid) { oc = ocs[i]; break; } }
  if (!oc || !oc.items || !oc.items[itemIdx]) return;
  var it = oc.items[itemIdx];
  if (!it.etapas) it.etapas = {};
  it.etapas[etapaId] = !it.etapas[etapaId];
  var p = calcPctOC(oc);
  if (p >= 100) oc.estado = 'Entregado';
  else if (p > 0) oc.estado = 'En produccion';
  if(ocActiva) saveOC(ocActiva); renderProduccion(); renderOCs();
}

function compartirItemWA(ocId, itemIdx) {
  var oc = null;
  var sid = String(ocId);
  for (var i = 0; i < ocs.length; i++) { if (String(ocs[i].id) === sid) { oc = ocs[i]; break; } }
  if (!oc || !oc.items || !oc.items[itemIdx]) return;
  var it = oc.items[itemIdx];
  var pct = calcPctItem(it.etapas||{});
  var h = ETAPAS.filter(function(e) { return it.etapas&&it.etapas[e.id]; }).map(function(e){return e.label;});
  var p = ETAPAS.filter(function(e) { return !it.etapas||!it.etapas[e.id]; }).map(function(e){return e.label;});
  var txt = 'GRAFYNEX - Avance de produccion\nOC ' + oc.num + ' - ' + oc.cliente + '\n' + it.desc + '\n' + Number(it.cant||0).toLocaleString() + ' uds\n\nAvance: ' + pct + '%\n' + (h.length?'Completado: '+h.join(', ')+'\n':'') + (p.length?'Pendiente: '+p.join(', '):'') + '\n\nGrafynex S.A.C.';
  window.open('https://wa.me/?text=' + encodeURIComponent(txt));
}

function compartirOCWA(ocId) {
  var oc = null;
  var sid = String(ocId);
  for (var i = 0; i < ocs.length; i++) { if (String(ocs[i].id) === sid) { oc = ocs[i]; break; } }
  if (!oc) return;
  var pctOC = calcPctOC(oc);
  var txt = 'GRAFYNEX - Reporte de produccion\nOC ' + oc.num + ' - ' + oc.cliente + '\nAvance general: ' + pctOC + '%\n\n';
  (oc.items||[]).forEach(function(it,i) {
    var pct = calcPctItem(it.etapas||{});
    var u = ''; ETAPAS.forEach(function(e){if(it.etapas&&it.etapas[e.id])u=e.label;});
    txt += (i+1) + '. ' + it.desc + '\n   ' + pct + '%' + (u?' - '+u:'') + '\n';

}

    +'<div class="footer">Grafynex S.A.C. - RUC: 20615845656 - Generado el '+new Date().toLocaleString('es-PE')+'</div></body></html>';
  var blob = new Blob([h],{type:'text/html'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href=url; a.download='OC-'+oc.num+'-Grafynex.html'; a.click();
  URL.revokeObjectURL(url);
  toast('PDF generado: OC-'+oc.num);
}

// Init Firebase after page loads
window.addEventListener('load', function() {
  try {
    if (!firebase.apps || !firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    db = firebase.firestore();
    db.collection('ocs').orderBy('fechaCreacion', 'desc').onSnapshot(function(snapshot) {
      ocs = [];
      snapshot.forEach(function(doc) {
        var data = doc.data();
        data.id = doc.id;
        ocs.push(data);
      });
      dbLoaded = true;
      renderOCs();
      if (document.getElementById('page-produccion').classList.contains('active')) {
        poblarSelectOC(); renderProduccion();
      }
      if (document.getElementById('page-resumen').classList.contains('active')) {
        renderResumen();
      }
    }, function(error) {
      console.error('Firebase error:', error);
      toast('Error de conexion con Firebase');
      dbLoaded = true;
      renderOCs();
    });
  } catch(e) {
    console.error('Firebase init error:', e);
    toast('Error iniciando Firebase');
  }
});

renderOCs();
</script>
